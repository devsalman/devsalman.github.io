services:
  jekyll:
    image: ruby:3.2
    user: "1000:1000"
    working_dir: /srv/jekyll
    environment:
      - HOME=/tmp
      - JEKYLL_ENV=docker
    command: bash -c "bundle install && bundle exec jekyll serve -l -H 0.0.0.0 --force_polling --config _config.yml,_config_docker.yml"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
volumes:
  bundle: